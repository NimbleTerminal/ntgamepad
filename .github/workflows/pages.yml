# ntgamepad - Copyright (c) 2026 Neomantra Corp.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            examples/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install Task
        uses: go-task/setup-task@v2
      - name: Build the browser demos
        run: |
          task web:build
          cp LICENSE web/LICENSE
      - name: Check the site
        run: |
          node --check web/site.js
          node --check web/compat.js
          test -s web/demos/pad.wasm
          test -s web/demo.wasm
          test -s web/booba/booba.js
          test -s web/wasm_exec.js
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
