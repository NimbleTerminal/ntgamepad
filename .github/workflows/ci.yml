name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            examples/go.sum
      - name: Install Task
        uses: go-task/setup-task@v2
      - name: Check, vet, and test
        run: task ci
      - name: Fuzz briefly
        if: matrix.os == 'ubuntu-latest'
        run: task fuzz-smoke
      - name: Build the browser demos
        if: matrix.os == 'ubuntu-latest'
        run: task web:build
